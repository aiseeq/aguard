# aguard: ~/.config/aguard/config.toml. Перечитывается каждый проход.
# Неизвестный ключ — ошибка, проход пропускается (в журнале службы).
# Размеры: "500K", "5MB", "1G" (двоичные). Длительности: "5m", "72h".

lead = "lead"          # имя сессии лида: верхняя ступень сводок

[admins]               # префикс cwd сессии -> админ пространства; остальное — лиду
"~/work" = "work-admin"
"~/git" = "git-admin"

# ── orphans: процессы умерших сессий (бывший procguard) ──────────────────────
# Сирота — свой процесс, у которого CLAUDE_PID в окружении указывает на мёртвую
# сессию (pid нет или его занял процесс моложе самого раннего процесса сессии).
# Снимается дерево: корень-сирота и все его потомки по ppid.
[orphans]
# observe — ничего не снимает и не шлёт: журнал ~/.local/state/aguard/orphans/journal.log,
#           строка «снял бы» по разу на дерево;
# act     — SIGTERM всему дереву, через term_wait SIGKILL оставшимся; контейнер podman — podman stop.
mode = "observe"
interval = "5m"
min_dead = "1h"        # сколько процесс должен прожить после смерти сессии
term_wait = "30s"

[orphans.mute_until]   # префикс cwd -> дата, до которой сводок нет, только журнал

# Исключения: поля одной записи должны совпасть все (comm — regexp целиком,
# args — regexp-поиск по командной строке, cwd — префикс cwd процесса,
# session — CLAUDE_CODE_SESSION_ID, until — после этой даты не действует).
# Совпал любой процесс дерева — дерево не трогаем. Сервисы (*.service в cgroup),
# деревья под живой claude и с claude внутри не трогаются и без исключений.
[[orphans.exclude]]
comm = "catatonit"
reason = "pause-процесс rootless podman: держит namespace всех контейнеров"

# ── tmp: записи в /tmp и их владельцы (бывший tmpguard, user-часть) ──────────
# Снимок пишет system-служба tmpguard-track (root: fanotify и proc connector).
[tmp]
# observe — ничего не шлёт, пишет в журнал, кому и что отправил бы;
# alert   — шлёт сводки в сессии Claude Code.
mode = "observe"
interval = "5m"
fighters = ["opencode", "opencode.exe", "codex", "claude"]   # comm бойцов между создателем и сессией
ignore = ["/tmp/.X11-unix", "/tmp/.ICE-unix", "/tmp/.font-unix", "/tmp/cc-socks"]

[tmp.policy]
min_entry = "1MB"
min_owner = "5MB"
budget_gb_min = 100    # порог «размер × время» на владельца, ГБ·мин
max_listed = 15

[tmp.pressure]         # под давлением памяти порог умножается на factor
psi_some_avg60 = 5.0
swap_used_pct = 50.0
factor = 0.5

[tmp.escalation]
after_summaries = 2    # не убрано за столько сводок — ступень выше
top_repeat = "30m"     # верхней ступени (лиду) повтор не чаще

[tmp.cache]            # общие кеши без владельца
paths = ["/tmp/.cache", "/tmp/node-compile-cache", "/tmp/claude-tmp/node-compile-cache", "/tmp/playwright-transform-cache-*", "/tmp/jest_rs"]
max = "1G"
clean_older = "72h"
clean = true

# ── memory: пики памяти сессий ───────────────────────────────────────────────
# Только запись, ничего не ограничивает: ~/.local/state/aguard/memory/<день>.jsonl,
# сводка — aguard memory report. По ней выбирается мягкий потолок (docs/design.md).
[memory]
interval = "1m"        # пик за интервал считает ядро (memory.peak), между проходами он не теряется
top_procs = 3
keep = "1440h"         # 60 дней

# Можно ли cl перезапустить сессию на новую версию Claude Code: cl спрашивает в сокет, aguard отвечает вердиктом.
# Нет ответа — cl не перезапускает. mode = "act" — cl перезапускает всерьёз, "log" — только пишет, что сделал бы.
[restart]
mode = "log"
idle = "10m"
# socket = "/run/user/1000/aguard/aguard.sock"
# claude = "~/.local/bin/claude"
# hook_states = "/run/user/1000/claude-hooks/sessions"

# Таймеры, которые роль ставит заново сама: их потеря перезапуск не держит.
[[restart.roles]]
names = ["lead"]
restorable_crons = ["Сон (скилл sleep)", "Дайджест (скилл digest)"]

# Отказы и ожидания агентов по транскриптам ~/.claude/projects: таймауты хуков, ошибки API, сжатия контекста.
[waits]
interval = "1m"
backfill = "168h"      # насколько назад догрузить транскрипты, бывшие до первого прохода; "0s" — не догружать
backfill_mb = 200      # сколько МБ догрузки за проход
keep = "1440h"         # 60 дней
