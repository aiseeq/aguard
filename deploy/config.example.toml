# aguard: ~/.config/aguard/config.toml. Перечитывается каждый проход.
# Неизвестный ключ — ошибка, проход пропускается (в журнале службы).
# Размеры: "500K", "5MB", "1G" (двоичные). Длительности: "5m", "72h".

lead = "lead"          # имя сессии лида: верхняя ступень сводок

[admins]               # префикс cwd сессии -> админ пространства; остальное — лиду
"~/work" = "work-admin"
"~/git" = "git-admin"

# ── orphans: процессы умерших сессий (бывший procguard) ──────────────────────
# Сирота — свой процесс, у которого CLAUDE_PID в окружении указывает на мёртвую
# сессию (pid нет или его занял процесс моложе самого раннего процесса сессии).
# Снимается дерево: корень-сирота и все его потомки по ppid.
[orphans]
# observe — ничего не снимает и не шлёт: журнал ~/.local/state/aguard/orphans/journal.log,
#           строка «снял бы» по разу на дерево;
# act     — SIGTERM всему дереву, через term_wait SIGKILL оставшимся; контейнер podman — podman stop.
mode = "observe"
interval = "5m"
min_dead = "1h"        # сколько процесс должен прожить после смерти сессии
term_wait = "30s"

[orphans.mute_until]   # префикс cwd -> дата, до которой сводок нет, только журнал

# Исключения: поля одной записи должны совпасть все (comm — regexp целиком,
# args — regexp-поиск по командной строке, cwd — префикс cwd процесса,
# session — CLAUDE_CODE_SESSION_ID, until — после этой даты не действует).
# Совпал любой процесс дерева — дерево не трогаем. Сервисы (*.service в cgroup),
# деревья под живой claude и с claude внутри не трогаются и без исключений.
[[orphans.exclude]]
comm = "catatonit"
reason = "pause-процесс rootless podman: держит namespace всех контейнеров"

# ── tmp: записи в /tmp и их владельцы (бывший tmpguard, user-часть) ──────────
# Снимок пишет system-служба tmpguard-track (root: fanotify и proc connector).
[tmp]
# observe — ничего не шлёт, пишет в журнал, кому и что отправил бы;
# alert   — шлёт сводки в сессии Claude Code.
mode = "observe"
interval = "5m"
fighters = ["opencode", "opencode.exe", "codex", "claude"]   # comm бойцов между создателем и сессией
ignore = ["/tmp/.X11-unix", "/tmp/.ICE-unix", "/tmp/.font-unix", "/tmp/cc-socks"]

[tmp.policy]
min_entry = "1MB"
min_owner = "5MB"
budget_gb_min = 100    # порог «размер × время» на владельца, ГБ·мин
max_listed = 15

[tmp.pressure]         # под давлением памяти порог умножается на factor
psi_some_avg60 = 5.0
swap_used_pct = 50.0
factor = 0.5

[tmp.escalation]
after_summaries = 2    # не убрано за столько сводок — ступень выше
top_repeat = "30m"     # верхней ступени (лиду) повтор не чаще

[tmp.cache]            # общие кеши без владельца
paths = ["/tmp/.cache", "/tmp/node-compile-cache", "/tmp/claude-tmp/node-compile-cache", "/tmp/playwright-transform-cache-*", "/tmp/jest_rs"]
max = "1G"
clean_older = "72h"
clean = true

# ── memory: пики памяти сессий ───────────────────────────────────────────────
# Только запись, ничего не ограничивает: ~/.local/state/aguard/memory/<день>.jsonl,
# сводка — aguard memory report. По ней выбирается мягкий потолок (docs/design.md).
[memory]
interval = "1m"        # пик за интервал считает ядро (memory.peak), между проходами он не теряется
top_procs = 3
keep = "1440h"         # 60 дней

# Можно ли cl перезапустить сессию на новую версию Claude Code: cl спрашивает в сокет, aguard отвечает вердиктом.
# Нет ответа — cl не перезапускает. mode = "act" — cl перезапускает всерьёз, "log" — только пишет, что сделал бы.
[restart]
mode = "log"
idle = "10m"
# socket = "/run/user/1000/aguard/aguard.sock"
# claude = "~/.local/bin/claude"
# hook_states = "/run/user/1000/chooks/sessions"


# Ожидания, которые агенты заводят сами (циклы sleep, wfor, фоновые команды, ответы сессий, опросы codex): чего ждали,
# сколько, во сколько вызовов и токенов. Транскрипты Claude и бойцов codex; сводка — aguard agentwaits report.
[agentwaits]
interval = "5m"
backfill = "168h"      # транскрипты, изменённые за этот срок до первого прохода, читаются с начала
backfill_mb = 300      # сколько МБ читать за проход (первый файл прохода — целиком)
max_open = "6h"        # дольше открытое ожидание закрывается с исходом none
keep = "1440h"         # 60 дней

# Отказы и ожидания агентов по транскриптам ~/.claude/projects: таймауты хуков, ошибки API, сжатия контекста.
[waits]
interval = "1m"
backfill = "168h"      # насколько назад догрузить транскрипты, бывшие до первого прохода; "0s" — не догружать
backfill_mb = 200      # сколько МБ догрузки за проход
keep = "1440h"         # 60 дней

# Своё сжатие бесед в простое, пока кэш подсказки жив (час от начала запроса). mode = "log" — журнал «сжал бы» и
# сверка с тем, что случилось; "off" — выключено; "act" (отправка /compact) пока не сделан.
[compact]
mode = "log"
min_tokens = 100000    # контекст последнего ответа, с которого сжимать или сбрасывать (сброс — с after, без before)
after = "53m"          # окно от начала последнего запроса: встроенное сжатие срабатывает около 54-й минуты
before = "57m"         # позже кэш может умереть раньше, чем сжатие его прочитает
tty_quiet = "2m"       # столько не было ввода в терминал: человек не печатает прямо сейчас
interval = "1m"
keep = "1440h"         # 60 дней

# ── disk: рост папок кэшей и состояний, остатки временного, быстрое наполнение ─
# Записи — дети roots и дети папок по шаблонам containers (scratchpad сессий, worktree). Место — по экстентам
# (FIEMAP): reflink-копии внутри записи считаются один раз, длины — до сжатия. Только журнал: кому и что сообщил бы.
# Задним числом: aguard disk retro -days 7.
[disk]
mode = "log"
interval = "1m"        # замер свободного места
walk = "1h"            # полный обход записей (~4 мин 26.10); раньше — если место тает быстро
roots = ["~/.cache", "~/.local/state", "/var/tmp"]
containers = ["~/.cache/claude-tmp/claude-*/*", "~/.cache/worktrees/*"]
grow = "5G"            # рост записи за сутки
fast = "5G"            # убыль свободного места за fast_window
fast_window = "10m"
stale = "48h"          # столько без изменений — остаток временного
stale_min = "1G"       # остаток от этого размера
# Долгоживущие кэши инструментов: не остатки и меряются по st_blocks (быстрее). Список в файле заменяет умолчание.
lasting = ["~/.cache/go-build", "~/.cache/gopls", "~/.cache/goimports", "~/.cache/staticcheck", "~/.cache/uv",
  "~/.cache/pip", "~/.cache/ms-playwright", "~/.cache/puppeteer", "~/.cache/google-chrome*"]
keep = "1440h"         # 60 дней
trace_min = "1G"       # scratchpad умершей сессии и копии транскриптов — следы от этого; находка по классу — от него
# снимки tmpguard-track-home: кто создал след; первый свежий из списка
track = ["/run/tmpguard-home/state.json", "/var/lib/tmpguard-home/state.json"]
# На /home свободно меньше free_min — письмо лиду и free_tell сразу и раз в сутки, пока не поднимется (не зависит от mode).
free_min = "150G"
free_mode = "alert"    # off | log (только журнал «написал бы») | alert
free_tell = ["git-admin"]

[disk.owners]          # папка -> сессия-хозяин; остальных хозяин ищется по сессиям и таблице имён cl, иначе — лид
"~/.cache/farm-hard" = "llmark-master"
"~/.local/state/worker" = "llmark-master"

# Следы работы агентов (задание лида 26.10 13:43 CET): папки, где каждый ребёнок — один след; уборка и срок — по
# коду хозяина (sc2go tools/repo/scene-orders.sh, llmark farm/worker prune, ~/.claude/improve/moment-frame.sh).
[[disk.traces]]
dir = "~/.cache/sc2go-scene-orders"
kind = "неудача"
what = "материалы неудачной сверки приказов сцен (tools/repo/scene-orders.sh)"
owner = "sc2go-master"
cleanup = "scene-orders.sh при следующей неудаче удаляет старше 2 суток"
lifetime = "48h"

[[disk.traces]]
dir = "~/.cache/farm-hard"
kind = "прогон"
what = "прогоны фермы llmark"
owner = "llmark-master"
cleanup = "farm prune: 72 ч после конца, в начале run и lane"
lifetime = "72h"

[[disk.traces]]
dir = "~/.local/state/worker"
kind = "прогон"
what = "прогоны worker llmark"
owner = "llmark-master"
cleanup = "worker prune: 3 суток после итога, в начале run"
lifetime = "72h"

[[disk.traces]]
dir = "~/.cache/moment-frame"
kind = "копия"
what = "снимки кейсов evals Сна (~/.claude/improve/moment-frame.sh)"
owner = "lead"
cleanup = "moment-frame.sh убирает после кейса"
lifetime = "24h"

# Забытые фоновые задачи Bash: команда, которую Claude Code увёл в фон по таймауту, идёт дольше age и вывод молчит
# дольше quiet — письмо сессии-владельцу (по разу на задачу). Нарочно фоновые (run_in_background) не трогаются. Задачу
# снимает владелец, aguard не убивает.
[bgtask]
mode = "alert"         # off | log (только журнал) | alert
interval = "5m"
age = "60m"
quiet = "60m"

# Перегрузка процессора ноута и PC: системный load average за минуту и готовые к работе задачи в момент замера не
# меньше потоков машины — снимок готовых потоков по владельцам; держится подряд дольше after — письмо мастерам, у кого
# готовых задач не меньше notify потоков, и сводка лиду; одному адресату о машине не чаще repeat. Ничего не снимает и
# не понижает.
[cpu]
mode = "alert"         # off | log (только журнал «написал бы») | alert
interval = "1m"        # замер: load average за минуту и готовые задачи
after = "10m"          # письма — когда перегрузка держится подряд не меньше
repeat = "30m"         # письма одному адресату о машине — не чаще
notify = 0.25          # мастеру — если его готовых задач в снимке не меньше этой доли потоков машины
hosts = ["pc"]         # машины по ssh сверх своей
workers = "~/.local/state/worker"   # задания worker: unit бойца -> мастер

# Диск, своп и PSI: быстрые замеры — в кольцевой буфер памяти; случай фриза — сводкой в памяти службы
# (на диск — копия сводок cases.jsonl при остановке, по `aguard io report` и раз в час); сырой буфер —
# только ручным снимком `aguard io dump`.
[io]
mode = "alert"       # off | log (только журнал «написал бы») | alert
step = "100ms"
detail = "1s"        # проход по cgroup и процессам
ring = "5m"
trigger = 0.5        # шаг с простоем: PSI full io или mem не меньше этой доли шага
gap = "300ms"        # спокойный промежуток до gap случай не делит
case_min = "500ms"   # от этой длительности — виновники и строка журнала
context = "5s"       # виновники — и за столько до начала случая
alert_min = "2s"     # от этой длительности — письмо лиду и сессии-виновнику
alert_every = "15m"  # следующие случаи в эту паузу — одним письмом
quiet_bytes = 1048576  # обмен с диском за случай меньше — тихий (простой без трафика), не в письма
cases_keep = "336h"  # срок сводок
keep = "168h"        # срок ручных снимков
device = "nvme0n1"

# Сломанный путь graft на PC: событие из jsonl, письмо мастеру-владельцу и сводка лиду при нескольких мастерах.
# Старый файл при первом проходе только отмечается; новые строки читаются с сохранённого смещения.
[remote]
mode = "alert"         # off | log (только журнал «написал бы») | alert
interval = "1m"
repeat = "1h"           # письмо по проекту и PC, а также сводка по PC — не чаще
file = "~/.cache/graft/remote-broken.jsonl"

# Сторож старта Сна и Дайджеста, а также зависшего окна доверия после перезапуска cl.
# mode = log — только пишет «написал бы»; alert — письмо лиду и also_to (сигнал «лид не поднялся» лиду же не поможет).
[night]
mode = "alert"         # off | log | alert
interval = "1m"
dream_by = "03:00"
dream_marker = "~/.claude/improve/runs/{date}/started"
digest_by = "07:00"
digest_marker = "~/.local/state/digest/started"
trust_wait = "5m"
also_to = ["git-admin"]

[said]                 # указатель сказанного: реплики пользователя -> Luna -> ~/.claude/said.tsv
mode = "log"           # off | log (разметка и расход только в журнал) | write (и в said.tsv)
interval = "1m"
names = ["lead", "*-admin", "*-master"]  # чьи реплики, шаблоны по имени сессии
model = "luna"         # имя из ~/.config/models/approved
effort = "low"
timeout = "2m"
file = "~/.claude/said.tsv"
context = 800          # знаков конца сообщения агента как «в ответ на»
candidates = 8         # прежних записей той же области для supersedes
retries = 3
batch = 20             # реплик за проход
pause = "15m"          # модель не ответила (429, сеть) — следующий вызов не раньше
keep = "1440h"         # срок журнала ~/.local/state/aguard/said
