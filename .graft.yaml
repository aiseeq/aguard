# Коммитить проект: graft commit -m "…" — гейт, git add -A, проверки и коммит.
schema: 1
graft: '>=2.37.0'
# go fix -diff ./... идёт после go vet с его окружением: модернизаторы тулчейна не оставляют правок.
go_fix:
  enabled: true

tasks:
  test:
    desc: все тесты
    tests: go
    run:
      - go test -p {threads} -json {args} ./...

# Гейт: go vet (graft сам, первым шагом), gofmt, тесты и glint без находок.
gate:
  - sh: 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
  - task: test
  # glint выходит с кодом 0 и при находках — гейт по строке итога; tee — чтобы находки были видны.
  - sh: GOWORK=off ~/bin/glint check . | tee /dev/stderr | grep -q 'No issues found!'

version:
  mode: none

push:
  force_with_lease: ['w/*']

checks:
  large_files:
    max_binary_bytes: 1048576
    max_text_bytes: 1048576
    binary_extensions: [png, jpg, jpeg, gif, webp, pdf, gz, zst, sc2replay]

lock:
  scope: worktree
