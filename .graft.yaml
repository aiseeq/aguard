# Коммит aguard — graft: graft commit -m "…" — гейт, git add -A, проверки, коммит, push.
schema: 1
graft: '>=2.45.0'
# go fix -diff ./... идёт после go vet с его окружением: модернизаторы тулчейна не оставляют правок.
go_fix:
  enabled: true

tasks:
  test:
    desc: все тесты
    tests: go
    remote: true # тесты не читают вне дерева того, чего нет на PC: reflink без кэша пользователя — пропуск, живая проба night — только по AGUARD_NIGHT_PROBE
    run:
      - go test -p {threads} -json {args} ./...
  build:
    desc: aguard, cl и aguard-track-helper в bin/
    run:
      - go build -o bin/ ./cmd/...
  # Запущенные консоли держат старый cl, новые получат новый. Конфиги кладутся, только если их ещё нет.
  install:
    desc: aguard в ~/.local/bin с user-службой, cl в ~/bin
    deps: [build]
    run:
      - {install: bin/aguard, to: ~/.local/bin}
      - {install: bin/cl}
      - sh: ln -sfn ~/bin/cl ~/bin/cl-oom-prefix
      - sh: install -D -m 0644 deploy/aguard.service ~/.config/systemd/user/aguard.service
      - sh: install -D -m 0644 cmd/cl/agents.slice ~/.config/systemd/user/agents.slice
      - sh: '[ -f ~/.config/aguard/config.toml ] || install -D -m 0644 deploy/config.example.toml ~/.config/aguard/config.toml'
      - sh: '[ -f ~/.config/cl/config.json ] || install -D -m 0644 cmd/cl/config.json ~/.config/cl/config.json'
      - sh: systemctl --user daemon-reload && systemctl --user enable aguard.service && systemctl --user restart aguard.service
  # Один раз с отпечатком: помощник с дескрипторами root; им же снимаются старые root-службы, снимки переходят пользователю.
  # Проверка «aguard track check» идёт до снятия: не прошла — старые службы работают как работали. Дальше — обычный graft install.
  install-helper:
    desc: aguard-track-helper в /usr/local/sbin и его system-служба (один раз, sudo)
    deps: [build]
    run:
      - sh: sudo sh deploy/track-helper-install.sh "$USER" "$PWD/bin"
      - sh: sh deploy/track-migrate.sh
  # glint падает кодом выхода на находке high (умолчание fail_on); остальные проверяет tk done.
  # remote: при занятом ноуте graft шлёт его на pc (вывод там и тут побайтно один, glint-gate-remote).
  glint:
    desc: static analysis
    heavy: true
    remote: true
    env: {GOWORK: "off"}
    run:
      - glint check .

# Гейт: go vet (graft сам, первым шагом), gofmt, тесты и glint без находок high.
gate:
  - sh: 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
  - task: test
  - task: glint

version:
  mode: git-tag

push:
  force_with_lease: ['w/*']

checks:
  large_files:
    max_binary_bytes: 1048576
    max_text_bytes: 1048576
    binary_extensions: [png, jpg, jpeg, gif, webp, pdf, gz, zst]

lock:
  scope: worktree
